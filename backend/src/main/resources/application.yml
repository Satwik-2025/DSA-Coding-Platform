spring:
  application:
    name: dsa-platform
  profiles:
    # H2 in a local file by default, so the backend starts with zero setup AND keeps progress across restarts.
    # Use the "postgres" profile for a real server, or "h2mem" for a throw-away in-memory database.
    default: h2
  jpa:
    hibernate:
      # schema.sql is the source of truth; Hibernate only checks that entities match it.
      ddl-auto: validate
    # Controllers will return DTOs, so lazy loading outside a transaction should fail loudly, not silently query.
    open-in-view: false
    properties:
      hibernate:
        # All timestamps are stored as UTC so "days since last practice" never depends on the server's time zone.
        jdbc:
          time_zone: UTC
  sql:
    init:
      # Run schema.sql + data.sql on every start (both are idempotent), for H2 and Postgres alike.
      mode: always

server:
  port: ${PORT:8081}

app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
  unlock:
    # A topic unlocks when EVERY prerequisite meets both thresholds (CONTRACT.md section 2.3).
    # Kept here, not in the DB, so they can be tuned without a migration.
    min-retention: 0.6
    min-correct-count: 2
  readiness:
    # How many of the latest attempts in a topic count as "recent" for recent_accuracy.
    recent-attempts: 10
  hlr:
    # Trained offline in Python (CONTRACT.md section 6); loaded and validated once at startup by HlrPredictor.
    weights-path: classpath:ml/hlr_weights.json
  runner:
    # "local": hardened child processes (Java security manager, Python audit-hook guard, empty env).
    # "docker": one locked-down container per run (no network, read-only fs, CPU/memory/pids limits).
    sandbox: ${RUNNER_SANDBOX:local}
    # Empty = auto-detect python3 / python (3.8+ needed).
    python-command: ${RUNNER_PYTHON:}
    cpp-command: ${RUNNER_CPP:g++}
    # Native C++ cannot be contained by the local sandbox; only enable this for trusted, single-user use.
    allow-unsandboxed-native: ${RUNNER_ALLOW_UNSANDBOXED_NATIVE:false}
    docker:
      java-image: eclipse-temurin:21-jre
      python-image: python:3.12-slim
      cpp-image: gcc:13
      memory: 256m
      cpus: 1
      pids-limit: 64
  judge:
    # 0 = half the CPU cores, at most 4.
    workers: ${JUDGE_WORKERS:0}
    max-queued: 50
  rate-limit:
    submissions-per-minute: 10
    runs-per-minute: 20
  limits:
    max-code-chars: 65535

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    # File database under ./data (relative to where the backend starts, i.e. backend/data).
    # MODE=PostgreSQL + DATABASE_TO_LOWER so the same schema.sql/data.sql run unchanged on both databases.
    url: jdbc:h2:file:${DATA_DIR:./data}/dsa_platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  h2:
    console:
      # Lets you inspect stored rows at http://localhost:8081/h2-console during development/viva.
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: h2mem
  datasource:
    # Throw-away in-memory database (used by the tests). DB_CLOSE_DELAY=-1 keeps it alive for the app's lifetime.
    url: jdbc:h2:mem:dsa_platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    # DB_PORT matches docker-compose.yml, so moving to 5433 is one environment variable.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dsa_platform}
    username: ${DB_USER:dsa}
    password: ${DB_PASSWORD:dsa}
