# The whole platform in one command:   docker compose up --build
# Then open http://localhost:8080 (APP_PORT changes the port).
#
# Only the database (for running the backend yourself with the postgres profile):
#   docker compose up -d postgres
# DB_PORT moves the database's host port (e.g. 5433) if 5432 is already taken.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dsa-platform-db
    environment:
      POSTGRES_DB: dsa_platform
      POSTGRES_USER: dsa
      POSTGRES_PASSWORD: dsa
    ports:
      # 127.0.0.1: only this computer can reach the database (its password is the demo password "dsa").
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Named volume so attempt history survives container restarts.
      - dsa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsa -d dsa_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: dsa
      DB_PASSWORD: dsa
      # Submissions run in the hardened local sandbox inside this container (Java security manager,
      # Python guard).
      RUNNER_SANDBOX: local
      # nginx calls the backend from its own container, so it is not "this computer" to the backend.
      # The backend's port is not published to the host; only nginx can reach it.
      LOCAL_ONLY: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # Only this computer by default, because the site runs submitted code and has no login.
      # APP_HOST=0.0.0.0 opens it to the local network.
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  dsa_pgdata:
