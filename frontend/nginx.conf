server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API calls go to the backend container (docker-compose service "backend").
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Submissions can wait for the judge queue.
        proxy_read_timeout 180s;
    }

    # Hashed build files never change, so browsers may cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/problems/7, /mock, ...) all serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
